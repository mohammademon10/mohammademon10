  <text x="64" y="128" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" letter-spacing="4">HELLO, I'M</text>
  <text x="60" y="190" fill="#E5E7EB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="49" font-weight="750" letter-spacing="-1.5">Md. Emon Hossain</text>
  <text x="64" y="230" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">CSE Undergraduate  /  Software Developer  /  AI/ML Explorer</text>
  <text x="64" y="278" fill="#22D3EE" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">BUILDING PRACTICAL SOFTWARE. EXPLORING INTELLIGENT SYSTEMS.</text>
